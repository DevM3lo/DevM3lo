<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460">
    <style>
        .terminal { font-family: 'Ubuntu Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 15px; }
        .bg { fill: #ffffff; }
        .bar { fill: #e1e4e8; }
        .btn-close { fill: #ff5f56; }
        .btn-min { fill: #ffbd2e; }
        .btn-max { fill: #27c93f; }
        .text-main { fill: #24292e; }
        .prompt-user { fill: #28a745; font-weight: bold; }
        .prompt-dir { fill: #0366d6; font-weight: bold; }
        .prompt-sym { fill: #24292e; }
        .key { fill: #005cc5; font-weight: bold; }
        .add { fill: #28a745; font-weight: bold; }
        .del { fill: #cb2431; font-weight: bold; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { fill: #24292e; animation: blink 1s step-end infinite; }
    </style>
    <rect width="800" height="460" rx="8" class="bg" stroke="#d1d5da" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 792 0 Q 800 0 800 8 L 800 30 L 0 30 Z" class="bar"/>
    <circle cx="20" cy="15" r="6" class="btn-close"/>
    <circle cx="40" cy="15" r="6" class="btn-min"/>
    <circle cx="60" cy="15" r="6" class="btn-max"/>
    <text x="400" y="20" fill="#586069" font-family="sans-serif" font-size="13" text-anchor="middle">eduardo@dev: ~</text>
    
    <g class="terminal text-main">
        <!-- Neofetch command -->
        <text x="20" y="60"><tspan class="prompt-user">eduardo@dev</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-dir">~</tspan><tspan class="prompt-sym">$</tspan> cat dev_profile.txt</text>
        
        <text x="20" y="90">--------------------------------------------------------------------------</text>
        <text x="20" y="115"><tspan class="key">Uptime:</tspan>         <tspan id="age_data_dots">......................</tspan><tspan id="age_data">0 years, 0 months, 0 days</tspan></text>
        <text x="20" y="135"><tspan class="key">OS:</tspan>             Windows 11, WSL2 Ubuntu, Fedora</text>
        <text x="20" y="155"><tspan class="key">Formação:</tspan>       Análise e Desenvolvimento de Sistemas</text>
        <text x="20" y="175"><tspan class="key">Atuação:</tspan>        Desenvolvedor Backend</text>
        <text x="20" y="195"><tspan class="key">Stack.Backend:</tspan>  Java, Spring Boot, Python, SQL</text>
        <text x="20" y="215"><tspan class="key">Stack.Frontend:</tspan> JavaScript, TypeScript, Next.js</text>
        <text x="20" y="235"><tspan class="key">Ferramentas:</tspan>    Git, Docker, OpenAPI, FastAPI</text>
        <text x="20" y="255"><tspan class="key">Hobbies:</tspan>        Guitarra, AI (RAG), Fighting Games, Hardware, Soulslikes</text>
        <text x="20" y="275">--------------------------------------------------------------------------</text>
        
        <!-- GitHub Stats Command -->
        <text x="20" y="315"><tspan class="prompt-user">eduardo@dev</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-dir">~</tspan><tspan class="prompt-sym">$</tspan> ./fetch_github_stats.sh</text>
        
        <text x="20" y="345">Repos:<tspan id="repo_data_dots">.....</tspan><tspan id="repo_data">0</tspan> {Contribuídos: <tspan id="contrib_data_dots"></tspan><tspan id="contrib_data">0</tspan>} | Stars:<tspan id="star_data_dots">..........</tspan><tspan id="star_data">0</tspan></text>
        <text x="20" y="365">Commits:<tspan id="commit_data_dots">.................</tspan><tspan id="commit_data">0</tspan> | Followers:<tspan id="follower_data_dots">.......</tspan><tspan id="follower_data">0</tspan></text>
        <text x="20" y="385">Lines of Code:<tspan id="loc_data_dots">...........</tspan><tspan id="loc_data">0</tspan> ( <tspan id="loc_add_dots"></tspan><tspan id="loc_add" class="add">0</tspan>++, <tspan id="loc_del_dots"></tspan><tspan id="loc_del" class="del">0</tspan>-- )</text>
        
        <text x="20" y="425"><tspan class="prompt-user">eduardo@dev</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-dir">~</tspan><tspan class="prompt-sym">$</tspan> <tspan class="cursor">█</tspan></text>
    </g>
</svg>